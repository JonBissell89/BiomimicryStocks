# PROPOSAL, not yet wired up. Copy to .github/workflows/weekly.yml in a repo.
#
# What this replaces: the Monday Claude Code task, which only fires when the app
# happens to be open. This fires whether anyone is at the keyboard or not.
#
# What it cannot do: publish to the claude.ai artifact URL. That needs a Claude
# session. This publishes to GitHub Pages instead, which the page supports because
# it guards its self-save behind `if (window.claude && claude.use)` and falls back
# to a read-only house ledger with fully working per-visitor ledgers.

name: Weekly price refresh and rebalance

on:
  schedule:
    - cron: "0 13 * * 1"        # Mondays 09:00 America/New_York (UTC-4). Cron is UTC.
  workflow_dispatch:             # so you can also run it by hand

permissions:
  contents: write                # to commit refreshed prices and the ledger
  pages: write
  id-token: write

concurrency:
  group: weekly-rebalance
  cancel-in-progress: false      # never let two rebalances interleave on one ledger

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install yfinance pandas

      # Prices first. Largest companies by market cap, because total coverage is
      # the wrong target and a missing TSLA is what a visitor actually notices.
      - name: Top up price cache
        run: python tournament/scripts/fill_priority_prices.py 1500
        continue-on-error: true   # a rate-limited run is a partial run, not a failed one

      # Dry run is a real gate, not decoration: it fails the job if the plan is
      # nonsense, before anything touches the ledger.
      - name: Check the rebalance plan
        run: |
          python tournament/scripts/rebalance_house.py --dry | tee plan.txt
          python - <<'PY'
          import re, sys
          txt = open("plan.txt").read()
          sells = re.findall(r"SELL \$\s*([\d,]+\.\d\d)", txt)
          total = sum(float(s.replace(",", "")) for s in sells)
          val = float(re.search(r"portfolio value \$([\d,]+\.\d\d)", txt).group(1).replace(",", ""))
          print(f"proposed sells ${total:,.2f} of a ${val:,.2f} book")
          if val and total > val * 0.5:
              sys.exit("more than half the book would be sold in one week, refusing")
          PY

      - name: Rebalance
        run: python tournament/scripts/rebalance_house.py

      - name: Render and verify
        run: |
          python tournament/scripts/refresh_app.py | tee render.txt
          grep -q "WARNING" render.txt && { echo "ranked names missing prices"; exit 1; } || true
          python tournament/scripts/check_page.py
          python tournament/scripts/check_structure.py
          node tournament/scripts/validate_console.js tournament/build/bs_console.html

      # The published page needs the head skeleton the artifact host adds for free.
      - name: Wrap for static hosting
        run: |
          mkdir -p site
          { printf '%s' '<!doctype html><html><head><meta charset="utf-8">'
            printf '%s' '<meta name="viewport" content="width=device-width,initial-scale=1">'
            printf '%s' '<title>Balanced Systems Console</title></head><body>'
            cat tournament/build/bs_console.html
            printf '%s' '</body></html>'
          } > site/index.html

      - name: Commit refreshed data
        run: |
          git config user.name  "balanced-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tournament/data/price_cache.json tournament/data/paper_state.json
          git diff --staged --quiet || git commit -m "weekly: prices and rebalance $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
